<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Dynamic Website</title>
    <style>
        /* CSS: ওয়েবসাইটের রূপচর্চা বা ডিজাইন */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background 0.5s ease;
        }
        .clock-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 { font-size: 3rem; margin: 0 0 10px 0; color: #f1c40f; }
        #clock { font-size: 2.5rem; font-weight: bold; font-family: monospace; }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
        .light-mode { background-color: #f5f6fa; color: #2c3e50; }
        .light-mode .clock-container { background: rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body>

    <!-- HTML: ওয়েবসাইটের কঙ্কাল বা কাঠামো -->
    <div class="clock-container">
        <h1>Hello World!</h1>
        <p>Welcome to my first JavaScript website.</p>
        <div id="clock">00:00:00 PM</div>
        <button onclick="toggleTheme()">Change Theme</button>
    </div>

    <!-- JavaScript: ওয়েবসাইটের বুদ্ধি বা কার্যক্ষমতা -->
    <script>
        // ১. লাইভ ঘড়ি সচল রাখার কোড
        function updateClock() {
            const now = new Date();
            let timeString = now.toLocaleTimeString();
            document.getElementById('clock').innerText = timeString;
        }
        // প্রতি ১ সেকেন্ড পর পর ঘড়ি আপডেট হবে
        setInterval(updateClock, 1000);
        updateClock(); // ওয়েবসাইট লোড হতেই যেন ঘড়ি চালু হয়

        // ২. বাটন ক্লিক করলে ব্যাকগ্রাউন্ড কালার চেঞ্জ করার কোড
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }
    </script>
</body>
</html>
